apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.global.name }}
  labels:
    app.kebernetes.io/name: {{ .Values.global.name }}
    app.kubernetes.io/managed-by: 'helm'
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.global.name }}
                port:
                  number: {{ .Values.service.port }}