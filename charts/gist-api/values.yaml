# Default values for gist-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  name: gist-api

gistApiDeployment:
  replicaCount: 1
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 10
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  containerPort: 8080

image:
  name: vaidyaswapneel/gist-api
  pullPolicy: Always
  tag: 

ingress:
  host: gistapi.localhost

service:
  type: NodePort
  port: 8080
